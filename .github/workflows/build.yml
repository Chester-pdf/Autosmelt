          AUTOSMELT_EOF
          mkdir -p 'src/main/resources'
          cat > 'src/main/resources/fabric.mod.json' <<'AUTOSMELT_EOF'
          {
            "schemaVersion": 1,
            "id": "autosmelt",
            "version": "${version}",
            "name": "Auto Smelt",
            "description": "Авто-переплавка руды при добыче. Меню настройки с двумя режимами: всегда или только при приседании (sneak).",
            "authors": [],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [
                "com.autosmelt.AutoSmelt"
              ],
              "client": [
                "com.autosmelt.client.AutoSmeltClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.19.3",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          AUTOSMELT_EOF

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: autosmelt
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
